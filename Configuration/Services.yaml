services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WebVision\MimeConverter\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Converter/FileConverterRegistry.php'
      - '../Classes/Report/*'

  WebVision\MimeConverter\Converter\FileConverterRegistry:
    public: true
    arguments:
      $mimeConverterLocator: !tagged_locator { tag: 'mime.converter', index_by: 'identifier' }
